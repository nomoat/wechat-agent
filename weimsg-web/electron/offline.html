<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WeMsg Pilot · 无法连接</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #111417;
      color: #e9eef2;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Microsoft YaHei", sans-serif;
    }
    .card {
      width: min(520px, calc(100vw - 48px));
      padding: 32px;
      border-radius: 16px;
      background: #1a1f24;
      box-shadow: 0 20px 60px rgba(0, 0, 0, .4);
    }
    h1 { margin: 0 0 8px; font-size: 20px; }
    p { margin: 0 0 18px; color: #9aa7b2; font-size: 13px; line-height: 1.7; }
    code {
      display: block;
      padding: 10px 12px;
      border-radius: 8px;
      background: #0e1114;
      color: #95ec69;
      font-size: 12px;
      overflow-wrap: anywhere;
      margin-bottom: 18px;
    }
    button {
      border: 0;
      border-radius: 8px;
      padding: 10px 16px;
      background: #95ec69;
      color: #143414;
      font-weight: 700;
      cursor: pointer;
    }
    small { display: block; margin-top: 16px; color: #6f7c87; font-size: 11px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>无法连接 Web 看板</h1>
    <p>Electron 线上版会加载部署后的 Web URL。请确认 Docker 容器和网络地址可用。</p>
    <code id="target"></code>
    <button id="retry">重试</button>
    <small id="detail"></small>
  </div>
  <script>
    const params = new URLSearchParams(location.search);
    const target = params.get("url") || "http://127.0.0.1:8080";
    document.getElementById("target").textContent = target;
    document.getElementById("detail").textContent =
      params.get("description") || "";
    document.getElementById("retry").addEventListener("click", () => {
      location.href = target;
    });
  </script>
</body>
</html>
